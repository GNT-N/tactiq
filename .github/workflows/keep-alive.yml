name: Keep-alive Supabase

# Un projet Supabase gratuit se met en pause après 7 jours sans aucune requête,
# et sa reprise est manuelle. Un appel quotidien suffit à l'éviter.
# La route /api/secteurs est publique et interroge Postgres via Prisma :
# elle compte donc comme activité base de données.

on:
  schedule:
    # 06h17 UTC. On évite les heures pile : GitHub y décale souvent
    # les tâches planifiées à cause de la charge.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Réveiller le service et interroger la base
        env:
          # Surchargeable sans toucher au code : Settings > Secrets and
          # variables > Actions > Variables > CRM_URL
          URL: ${{ vars.CRM_URL || 'https://crm.gonot-nicolas.com' }}
        run: |
          cible="$URL/api/secteurs"
          echo "Ping de $cible"

          for tentative in 1 2 3; do
            # Le "|| code=000" est hors substitution : sinon le 000 écrit par
            # -w et celui de l'echo se concatènent en 000000 dans le journal.
            code=$(curl -s -o /tmp/reponse -w '%{http_code}' --max-time 90 "$cible") || code="000"
            echo "Tentative $tentative : HTTP $code"

            if [ "$code" = "200" ]; then
              echo "Base active, $(wc -c < /tmp/reponse) octets reçus."
              exit 0
            fi

            # Render peut mettre jusqu'à 60 s à sortir de veille.
            sleep 30
          done

          echo "::error::Aucune réponse 200 après 3 tentatives. Supabase est peut-être en pause, ou le service Render indisponible."
          exit 1
